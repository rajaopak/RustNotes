name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  release-windows:
    name: Build & Package Windows x64 Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Extract and verify version from Cargo.toml
        id: meta
        shell: pwsh
        run: |
          $toml = Get-Content "Cargo.toml" -Raw
          if ($toml -match '(?m)^version\s*=\s*"([^"]+)"') {
            $ver = $Matches[1]
          } else {
            throw "Version not found in Cargo.toml"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tagVer = $env:GITHUB_REF -replace '^refs/tags/v', ''
            if ($tagVer -ne $ver) {
              throw "Tag version ($tagVer) does not match Cargo.toml version ($ver)"
            }
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Build release executable (x86_64-pc-windows-msvc)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build Portable ZIP & validate runtime
        shell: pwsh
        run: |
          .\package_portable.ps1 -SkipBuild -TargetDir "target\x86_64-pc-windows-msvc\release"

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $found) {
              choco install innosetup -y --no-progress
              $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
            if (-not $found) {
              throw "Inno Setup Compiler (ISCC.exe) could not be found or installed."
            }
            Split-Path $found -Parent | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Build Windows Installer (RustNotes-Setup.exe)
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          iscc "/DMyAppVersion=$ver" "/DBuildDir=..\target\x86_64-pc-windows-msvc\release" "installer\rustnotes.iss"
          if (-not (Test-Path "dist\RustNotes-Setup.exe")) {
            throw "Expected dist\RustNotes-Setup.exe was not generated"
          }

      - name: Upload Windows distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RustNotes-Windows-x64-v${{ steps.meta.outputs.version }}
          path: |
            dist/RustNotes-Portable.zip
            dist/RustNotes-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/RustNotes-Portable.zip
            dist/RustNotes-Setup.exe
